uart:
  id: uart_bus
  tx_pin: GPIO4
  rx_pin: GPIO5
#  tx_pin: GPIO16
#  rx_pin: GPIO17
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  debug:
    direction: BOTH

logger:
   baud_rate: 0

external_components:
  - source:
      type: git
      url: https://github.com/taherehy/vallox-
      ref: main
      path: .
    components: [vallox]

number:
  - platform: template
    name: "Vallox Fan Speed"
    id: vallox_fan_speed
    min_value: 1
    max_value: 8
    step: 1
    optimistic: true

    set_action:
      - lambda: |-
          uint8_t value;

          switch ((int)x) {
            case 1: value = 0x01; break;
            case 2: value = 0x03; break;
            case 3: value = 0x07; break;
            case 4: value = 0x0F; break;
            case 5: value = 0x1F; break;
            case 6: value = 0x3F; break;
            case 7: value = 0x7F; break;
            case 8: value = 0xFF; break;
            default: return;
          }

          uint8_t pkt[6];

          pkt[0] = 0x01;       // Domain
          pkt[1] = 0x21;       // Panel
          pkt[2] = 0x11;       // Mainboard
          pkt[3] = 0x29;       // Fan speed variable
          pkt[4] = value;
          pkt[5] = pkt[0] + pkt[1] + pkt[2] + pkt[3] + pkt[4];

          id(uart_bus).write_array(pkt, 6);

          ESP_LOGI("vallox",
                   "Sent speed %d packet: %02X %02X %02X %02X %02X %02X",
                   (int)x,
                   pkt[0], pkt[1], pkt[2],
                   pkt[3], pkt[4], pkt[5]);

interval:
  - interval: 5s
    then:
      - lambda: |-
          if (!isnan(id(vallox_actual_speed).state)) {
            id(vallox_fan_speed).publish_state(
              id(vallox_actual_speed).state
            );
          }

 
